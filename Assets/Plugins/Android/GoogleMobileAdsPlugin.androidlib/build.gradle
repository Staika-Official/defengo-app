plugins {
    id 'com.android.library'
}

android {
    namespace "com.google.unity.ads"
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    compileSdkVersion 33
    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35
    }
}
